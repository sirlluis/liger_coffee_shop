version: 2

models:
  - name: stg_orders
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: branch_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: source('raw', 'branches')
                field: branch_id
      - name: in_or_out
        data_tests:
          - accepted_values:
              arguments:
                values: ['dine_in', 'take_out']
      - name: payment_method
        data_tests:
          - accepted_values:
              arguments:
                values: ['cash', 'card']

  - name: stg_order_items
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_orders')
                field: order_id
      - name: product_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id

  - name: stg_products
    columns:
      - name: product_id
        data_tests: [unique, not_null]
      - name: product_name
        data_tests: [not_null]

  - name: stg_recipes
    columns:
      - name: recipe_id
        data_tests: [unique, not_null]
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('stg_products')
                field: product_id
      - name: ingredient_id
        data_tests:
          - relationships:
              arguments:
                to: source('raw', 'ingredients')
                field: ingredient_id